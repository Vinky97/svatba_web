<!doctype html>
<html lang="$site_language">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$site_title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f1eb;
      --text:#695a51;
      --muted:#8e8076;
      --burgundy:#8b2031;
      --paper:#f6ead2;
      --paper-shadow:#ead4ae;
      --ease-main:cubic-bezier(.22,1,.36,1);
      --ease-soft:cubic-bezier(.2,.85,.26,1);
      --card-left:17%;
      --card-top:41.5%;
      --card-width:66%;
      --card-height:19%;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:"Libre Baskerville",serif;background:var(--bg);color:var(--text)}
    body.intro-lock{overflow:hidden}

    #introOverlay{
      position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;
      background:radial-gradient(circle at top,#ffffff 0%,#f7f3ee 42%,#efe7df 100%);
      transition:opacity .9s ease, visibility .9s ease;
    }
    #introOverlay.hiding{opacity:0;visibility:hidden;pointer-events:none}

    .intro-wrap{width:min(100%,1100px);display:grid;justify-items:center;gap:18px}
    .intro-copy{text-align:center;max-width:760px;color:var(--muted);opacity:0;transform:translateY(12px);transition:opacity .65s ease, transform .65s ease}
    .intro-copy h1{margin:0 0 12px;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2rem,3vw,3.1rem);color:#7d6c61}
    .intro-copy p{margin:0;line-height:1.75;font-size:clamp(.94rem,1.15vw,1rem)}
    .intro-wrap.ready .intro-copy,.intro-wrap.ready .intro-hint{opacity:1;transform:translateY(0)}

    .scene{
      position:relative;
      width:min(82vw,620px);
      aspect-ratio:1024 / 1536;
      perspective:2400px;
      filter:drop-shadow(0 30px 70px rgba(66,48,36,.18));
      isolation:isolate;
    }
    .scene-shadow{position:absolute;left:50%;bottom:7%;width:72%;height:10%;transform:translateX(-50%);background:radial-gradient(circle,rgba(0,0,0,.16),rgba(0,0,0,0) 72%);filter:blur(18px);z-index:0}

   

    #page{
      opacity:0; transform:translateY(118px) scale(.94);
      clip-path: inset(39% 15% 23% 15% round 18px);
      transition:opacity 1s ease, transform 1.15s var(--ease-main), clip-path 1.18s var(--ease-main);
      will-change:transform, opacity, clip-path;
    }
    body.revealing #page{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0 0 0 0 round 0)}

    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:linear-gradient(rgba(247,243,238,.86),rgba(247,243,238,.86)),url("kyticka.jpg");background-size:cover;background-position:center 25%}
    .headline{font-family:"Great Vibes",cursive;font-size:clamp(4rem,8vw,6.6rem);color:var(--burgundy);margin-bottom:16px;line-height:1}
    .names{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,3.6vw,3.1rem);color:var(--burgundy);margin-bottom:18px}
    .names span{margin:0 10px}
    .countdown{font-size:1.05rem;color:#8a7f76;margin-bottom:26px}.countdown strong{font-size:clamp(2rem,4vw,3rem);color:var(--burgundy)}
    .when-where{font-size:1rem;line-height:1.8}.when-where strong{color:var(--burgundy)}
    .content{max-width:920px;margin:80px auto;padding:0 20px 80px}
    h2{margin:0 0 16px;text-transform:uppercase;letter-spacing:.2em;font-size:.95rem;color:var(--burgundy)}
    p{line-height:1.8;margin:10px 0 26px}
    a{color:var(--burgundy);text-decoration:none;border-bottom:1px solid rgba(140,32,49,.28)}a:hover{border-bottom-color:rgba(140,32,49,.75)}

    @media (max-width:720px){
      .scene{width:min(92vw,560px)}
      .seal-btn{width:min(29%,154px)}
      .insert-monogram{width:min(34%,125px)}
      .insert-title{font-size:clamp(1.1rem,3.2vw,1.55rem)}
      #page{clip-path: inset(43% 7% 24% 7% round 16px)}
      .intro-hint{font-size:.72rem}
    }
    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto!important}
      #introOverlay,.intro-copy,.intro-hint,.closed-base,.open-base,.insert-card,.flap-piece,.flap-back,.seal-btn,#page{transition:none!important;animation:none!important}
      #page{opacity:1!important;transform:none!important;clip-path:none!important}
    }
  </style>
</head>
<body class="intro-lock">
  
  <div id="page">
    <section class="hero">
      <div>
        <div class="headline">Budeme se brát</div>
        <div class="names">$bride_name <span>&amp;</span> $groom_name</div>
        <div class="countdown">Zbývá <strong id="days" data-date="$wedding_date_iso">–</strong> dní</div>
        <div class="when-where"><strong>$wedding_date_display</strong><br>Obřad $wedding_ceremony_time<br>$ceremony_name</div>
      </div>
    </section>
    <section class="content">
      <h2>Místa</h2>
      <p><strong>Obřad + Hostina</strong><br>$ceremony_name<br>$ceremony_address<br><a href="https://www.google.com/maps/search/?api=1&query=$ceremony_map_query">Zobrazit mapu</a></p>
      <p>Prosíme potvrdit účast $rsvp_deadline_display.</p>
      <a href="https://eur02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fforms.gle%2FQ1tV5g5Vm5uk8DV87&data=05%7C02%7Cmichaela.vinklarkova%40knorr-bremse.com%7C45e60444564d463b115f08de9af03b07%7C66f6821e0a304a068b8b901bbfd2bc60%7C0%7C0%7C639118554548489240%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C80000%7C%7C%7C&sdata=afjQU6VcbxFkCf1woEY1samtkVy%2FzZdfr055ifeD7KE%3D&reserved=0">Klikni sem pro potvrzení účasti.</a>
    </section>
  </div>

  <script>
    (()=>{
      const body=document.body;
      const overlay=document.getElementById('introOverlay');
      const wrap=document.getElementById('introWrap');
      const scene=document.getElementById('scene');
      const sealButton=document.getElementById('sealButton');
      let started=false;

      window.addEventListener('load',()=>requestAnimationFrame(()=>wrap.classList.add('ready')));

      function revealPage(){ body.classList.add('revealing'); }
      function finishIntro(){
        overlay.classList.add('hiding');
        setTimeout(()=>{ overlay.style.display='none'; body.classList.remove('intro-lock'); }, 900);
      }
      function startIntro(){
        if(started) return;
        started=true;
        scene.classList.add('opening');
        setTimeout(revealPage, 1250);
        setTimeout(finishIntro, 2750);
      }
      sealButton.addEventListener('click', startIntro);
      sealButton.addEventListener('keydown',(e)=>{
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); startIntro(); }
      });
      setTimeout(()=>{ if(!started) startIntro(); }, 5800);

      function parseISODateToLocalMidnight(iso){
        if(!iso) return null;
        const clean=String(iso).trim();
        if(clean.startsWith('$')) return null;
        const [y,m,d]=clean.split('-').map(Number);
        if(!y||!m||!d) return null;
        return new Date(y,m-1,d);
      }
      window.addEventListener('DOMContentLoaded',()=>{
        const daysEl=document.getElementById('days');
        if(!daysEl) return;
        const wedding=parseISODateToLocalMidnight(daysEl.dataset.date);
        if(!wedding){ daysEl.innerText='—'; return; }
        const today=new Date(); today.setHours(0,0,0,0); wedding.setHours(0,0,0,0);
        const diff=Math.ceil((wedding-today)/(24*60*60*1000));
        daysEl.innerText=diff>=0?diff:0;
      });
    })();
  </script>
</body>
</html>
